{%extends "base.html"%}{%block title%}Iniciar sesión{%endblock%}{%block content%}
  <h1>Iniciar sesión</h1>
  {%if form.errors%}<p style="color:red;">Usuario o contraseña incorrectos.</p>{%endif%}
  <form method="post">{%csrf_token%}
    <p><label for="id_username">Usuario</label><br>{{form.username}}</p>
    <p><label for="id_password">Contraseña</label><br>{{form.password}}</p>
    <button type="submit">Entrar</button>
    {%if next%}<input type="hidden" name="next" value="{{ next }}">{%endif%}</form>
{%endblock%}
