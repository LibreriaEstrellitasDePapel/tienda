<!DOCTYPE html><html lang="es">
<head><meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Librería WiTo</title><!--https://visme.co/blog/wp-content/uploads/pastel-colors-hex-codes-pastel-colors.jpg-->
  <style>
    body{
      font-family: Arial, sans-serif;
      margin:0;background:#ffabab;
      color:#222;}
    header{background:#ff7272;
      color:#fff;
      padding:24px 16px;
      text-align:center;}
    header h1{margin:0; font-size:2rem;}
    header p{margin:8px 0 0; opacity:.9;}
    main{padding:20px; max-width:1000px; margin:0 auto;}
    .imagenes{display:grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap:16px;
      margin:18px 0 26px;}
    .imagenes figure{margin:0;
      background:#fff5ba;
      border-radius:12px;
      overflow:hidden;
      box-shadow:0 4px 14px rgba(0,0,0,.8);}
    .imagenes img{
      width:100%;
      height:220px;
      object-fit:cover;
      display:block;}
    .imagenes figcaption{
      padding:12px 14px;
      font-size:.95rem;
      color:#444;}
    .info{background:#fff2ab;
      padding:18px;
      border-radius:12px;
      box-shadow:0 4px 14px #000000cc;
      line-height:1.6;}
    .info h2{margin-top:0;}
    .dato{margin:10px 0;}
    a{color:#000;
      text-decoration:none;}
    a:hover{text-decoration:underline;}
    footer{text-align:center;
      padding:14px 10px;
      background:#ff7272;
      margin-top:22px;}
  </style>
</head>
<body>
  <header>
    <h1>Librería WiTo</h1>
    <p>Por un mundo, más boníto.</p>
  </header>
  <main>
    <h2>Nuestra tienda</h2>
    <!--IMÁGENES REALES:
        1) Crea una carpeta llamada "imgs" junto a tu index.html
        2) Guarda tus fotos ahí (por ejemplo: tienda1.jpg y tienda2.jpg)
        3) Asegúrate que los nombres coincidan con los del src-->
    <section class="imagenes">
      <figure>
        <img src="https://raw.githubusercontent.com/LibreriaEstrellitasDePapel/tienda/refs/heads/main/imgs/WiTo.jfif" alt="imgs/WiTo.jfif No ha cargado todavía." />
        <figcaption>Interior de nuestra librería</figcaption>
      </figure><figure>
        <img src="https://raw.githubusercontent.com/LibreriaEstrellitasDePapel/tienda/refs/heads/main/imgs/Temp.jpg" alt="imgs/Temp.jpg No ha cargado todavía." />
        <figcaption>Sección de novedades y recomendaciones</figcaption>
      </figure>
    </section>
    <section class="info">
      <h2>Contacto y ubicación</h2>
      <p class="dato"><strong>Dirección:</strong> Avenida de los Libros 123, Santiago, Chile</p>
      <!-- Teléfono clickeable (Android abre la app teléfono) -->
      <p class="dato"><strong>Teléfono:</strong>
        <a href="tel:+56936870721">+56 9 3687 0721</a>
      </p><!-- Correo clickeable (abre app de correo) -->
      <p class="dato"><strong>Email:</strong>
        <a href="mailto:contacto@libreria.cl">contacto@libreria.cl</a>
      </p><p class="dato"><strong>Horario:</strong> Lunes a Viernes, 9:00 a 18:00</p>
      <!--(Opcional) WhatsApp clickeable-->
      <!--<p class="dato">
        <strong>WhatsApp:</strong>
        <a href="https://wa.me/56936870721" target="_blank" rel="noopener">Escríbenos por WhatsApp</a>
      </p>-->
    </section>
  </main>
  <footer><p>© 2026 Librería WiTo.</p></footer>
</body></html>
